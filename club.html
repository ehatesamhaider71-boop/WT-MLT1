<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Club Membership</title>
</head>
<style>
    span:hover {
        box-shadow: inset 0 0 10px #000000;
    }
    * {
	text-align: center;
}
h1 {
    color: rgb(55, 1, 132);
}
</style>

<body>
    <h1>Programming Club</h1>

     <fieldset>
				<legend>Join the Club</legend>
                <label for="first_name">First Name:</label>
                <input type="text" class="name-field" id="first_name" name="fn" placeholder="Enter your first name" minlength="3" required />
                <br />
                <label for="last_name">Last Name:</label>
                <input type="text" class="name-field" id="last_name" name="ln" placeholder="Enter your last name" minlength="3" required />
                <br />
                <label for="email">Email:</label>
                <input type="email" id="email" name="em" placeholder="Enter the Email" required />
                <br />
                 <br />
            <label for="stu_id">Student ID:</label>
            <input type="text" id="stu_id" name="id" placeholder="ab-cdefg-h" pattern="[0-9]{2}-[0-9]{5}-[0-9] required" required />
            <br />
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="17" max="40" required />
            <br />
             <input type="radio" name="membership-type" id="general" required /> General
            <br />
            <input type="radio" name="membership-type" id="executive" required /> Executive
            <br />
             <select>
                <option value="" required>Select a Club</option>
                <option value="programming" required>Programming</option>
                <option value="robotics" required>robotics</option>
                <option value="debate" required>Debate</option>
            </select>
            <br />
              <textarea name="comments" id="comments" rows="5" cols="30" placeholder="Write your comment here!" maxlength="200"></textarea>
            <br/> 
             <input type="I agree to the club rules" />
            <br/>
             <input type="submit" value="Join now" />
            </fieldset>
</body>
</html>
